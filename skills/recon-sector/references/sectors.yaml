# Sector database for recon-sector — one entry per sector with platform-specific info.
# Used by recon-sector to tailor recon probes per industry.

sectors:
  automotive-dealers:
    platforms: [WordPress, Dealer.com, DealerOn, CDK Global]
    cms_dominant: WordPress
    hosting: "Shared hosting, CDK/Dealer.com SaaS"
    high_value_paths:
      - /wp-content/debug.log
      - /wp-content/uploads/
      - /wp-json/wp/v2/users
      - /xmlrpc.php
      - /financing
      - /credit-application
      - /inventory/api
    pii_risk: "Credit applications with SSN, income, address. Inventory VIN/cost data."

  bakeries:
    platforms: [WordPress, WooCommerce, Shopify, Toast POS]
    cms_dominant: WordPress
    hosting: "Shared hosting, Shopify"
